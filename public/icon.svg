<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="luma_base" x1="72" y1="48" x2="444" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061315"/>
      <stop offset="0.52" stop-color="#0D2024"/>
      <stop offset="1" stop-color="#18343A"/>
    </linearGradient>
    <radialGradient id="luma_beam" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 156) rotate(90) scale(168)">
      <stop stop-color="#FFE9A8" stop-opacity="0.9"/>
      <stop offset="0.36" stop-color="#FFD36E" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFD36E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="luma_letter" x1="160" y1="112" x2="352" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9E8"/>
      <stop offset="0.46" stop-color="#FFE49A"/>
      <stop offset="1" stop-color="#FFBD4A"/>
    </linearGradient>
    <linearGradient id="luma_rim" x1="96" y1="42" x2="404" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.19"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#FFD36E" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="luma_glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="luma_tile">
      <rect x="24" y="24" width="464" height="464" rx="112" />
    </clipPath>
  </defs>

  <g clip-path="url(#luma_tile)">
  <!-- Deep ink tile: the dark field the light mark is drawn on. -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#luma_base)"/>
  <rect x="27" y="27" width="458" height="458" rx="109" stroke="url(#luma_rim)" stroke-width="6"/>

  <!-- Luma: a rising light behind the L, with two restrained orbit lines. -->
  <circle cx="362" cy="154" r="164" fill="url(#luma_beam)"/>
  <circle cx="362" cy="154" r="76" fill="#FFE7A3" fill-opacity="0.13"/>
  <circle cx="362" cy="154" r="101" stroke="#FFD36E" stroke-opacity="0.22" stroke-width="3"/>
  <path d="M290 96A96 96 0 0 1 443 187" stroke="#FFF2C5" stroke-opacity="0.38" stroke-width="4" stroke-linecap="round"/>
  <path d="M285 66A125 125 0 0 1 458 171" stroke="#FFD36E" stroke-opacity="0.13" stroke-width="3" stroke-linecap="round"/>
  <path d="M398 87L403 100L416 105L403 110L398 123L393 110L380 105L393 100L398 87Z" fill="#FFF8DE"/>

  <!-- The L is the app's own mark: a bold, rounded letter with a warm light gradient. -->
  <g filter="url(#luma_glow)" opacity="0.5">
    <path d="M151 126C151 113.85 160.85 104 173 104H203C215.15 104 225 113.85 225 126V282H336C348.15 282 358 291.85 358 304V334C358 346.15 348.15 356 336 356H173C160.85 356 151 346.15 151 334V126Z" fill="#FFD36E"/>
  </g>
  <path d="M151 126C151 113.85 160.85 104 173 104H203C215.15 104 225 113.85 225 126V282H336C348.15 282 358 291.85 358 304V334C358 346.15 348.15 356 336 356H173C160.85 356 151 346.15 151 334V126Z" fill="url(#luma_letter)"/>

  <!-- A quiet highlight keeps the letter from reading as a flat silhouette. -->
  <path d="M172 126C172 121.58 175.58 118 180 118H198" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
