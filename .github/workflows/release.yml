name: Release

# push v* tag → 构建原生引擎 + 应用 → 打 NSIS 安装器/msix → 签名 → 创建 draft release 上传三件套。
# workflow_dispatch 供手动验证构建（不发 release）。
# 前提：仓库 Secrets 需配置 LUMA_PFX（pfx 的 base64）与 LUMA_PFX_PASSWORD（签名密码）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # bootstrap.py 的下载源全部 pin（.downloads 里文件存在即跳过），命中缓存则零下载
      - name: Cache bootstrap downloads
        uses: actions/cache@v4
        with:
          path: .downloads
          key: luma-downloads-windows-v1

      # 项目 SDK 固定 10.0.400，build.ps1 硬编码 .tools/dotnet/dotnet.exe
      - name: Cache dotnet SDK
        uses: actions/cache@v4
        with:
          path: .tools
          key: luma-dotnet-10.0.400-windows-v1

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: .packages
          key: luma-nuget-${{ hashFiles('app/LumaMusic.csproj', '**/NuGet.Config') }}

      - name: Bootstrap dependencies
        run: python scripts/bootstrap.py

      # bootstrap.py 下载失败只打印不报错，必须自己断言关键产物
      - name: Verify bootstrap artifacts
        shell: pwsh
        run: |
          foreach ($path in @('.tools/dotnet/dotnet.exe', 'vendor/bass/x64/bass.dll', 'vendor/flexasio/FlexASIOSetup.exe')) {
            if (!(Test-Path $path)) { throw "bootstrap artifact missing: $path" }
          }
          $sacd = Get-ChildItem vendor -Directory -Filter 'sacd*' -ErrorAction SilentlyContinue
          if (!$sacd) { throw 'bootstrap artifact missing: vendor/sacd*' }

      - name: Build native engine (runs LumaNativeTests)
        shell: pwsh
        run: ./scripts/build-native.ps1

      - name: Build and publish app
        shell: pwsh
        run: ./scripts/build.ps1 -Publish

      # 版本一致性：csproj <Version> 必须与 tag 一致（v1.2.3 ↔ 1.2.3），防止发错版本
      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $csproj = Get-Content app/LumaMusic.csproj -Raw
          if ($csproj -notmatch '<Version>([0-9.]+)</Version>') { throw 'csproj Version not found' }
          # PS 5.1 Out-File defaults to UTF-16 which corrupts GITHUB_OUTPUT; write explicit ASCII
          Add-Content $env:GITHUB_OUTPUT "app=$($Matches[1])" -Encoding ascii
      - name: Check tag matches version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          if ($tag -ne '${{ steps.version.outputs.app }}') {
            throw "tag v$tag != csproj Version ${{ steps.version.outputs.app }} (bump csproj Version before tagging)"
          }

      - name: Restore signing certificate
        env:
          LUMA_PFX: ${{ secrets.LUMA_PFX }}
        shell: pwsh
        run: |
          if (!$env:LUMA_PFX) { throw 'secret LUMA_PFX not set (base64 of the signing pfx)' }
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE/dist/LumaMusic.pfx", [Convert]::FromBase64String($env:LUMA_PFX))

      - name: Package MSIX
        env:
          LUMA_PFX_PASSWORD: ${{ secrets.LUMA_PFX_PASSWORD }}
        shell: pwsh
        run: ./scripts/make-msix.ps1 -Version '${{ steps.version.outputs.app }}.0'

      # NSIS 通常已随 windows runner 预装；缺失时才 choco 兜底，不必每次发版都多花一分钟安装
      - name: Ensure NSIS
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) { choco install nsis -y --no-progress }
          if (!(Test-Path $makensis)) { throw "makensis missing after choco install: $makensis" }
          & $makensis /VERSION

      - name: Package installer
        shell: pwsh
        run: ./scripts/make-installer.ps1 -Version '${{ steps.version.outputs.app }}'

      # dispatch 干跑不发 release，产物留 artifact 供下载检查
      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LumaMusic-${{ steps.version.outputs.app }}
          path: |
            dist/LumaMusic-Setup.exe
            dist/LumaMusic.msix
            dist/LumaMusic.cer
          retention-days: 14

      # draft：上传三件套后在网页上补 release notes（照 v1.0.2 格式）再手动 Publish
      - name: Create draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $assets = @('dist/LumaMusic-Setup.exe', 'dist/LumaMusic.msix', 'dist/LumaMusic.cer')
          foreach ($asset in $assets) {
            if (!(Test-Path -LiteralPath $asset -PathType Leaf) -or (Get-Item -LiteralPath $asset).Length -eq 0) {
              throw "release asset missing or empty: $asset"
            }
          }
          # Use release IDs to clean only matching drafts; never delete a published release or tag.
          $json = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to list releases' }
          $releases = @($json | ConvertFrom-Json | ForEach-Object { $_ } | Where-Object { $_.tag_name -ceq $tag })
          if (@($releases | Where-Object { !$_.draft }).Count -gt 0) {
            throw "Release $tag is already published"
          }
          foreach ($release in $releases) {
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)"
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete draft release $($release.id)" }
          }
          # 初稿用 annotated tag 的说明（在 tag message 里照 v1.0.2 格式写）；不用 --generate-notes，避免英文 What's Changed + Full Changelog。
          # 坑：checkout 会以 "+<commit-sha>:refs/tags/v1.1.5" 浅取，在本地造出的是**轻量 tag 引用**而非 annotated tag 对象，
          #     此时 git tag --format='%(contents)' 返回的是提交标题（v1.1.5 实测踩到，草稿正文写成了"发布 v1.1.5：升级应用版本号"）。
          #     所以优先用 API 直读 annotated tag 对象，取不到再退回本地 git。
          $body = ''
          try {
            $refJson = (gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" 2>$null) -join "`n"
            if ($refJson) {
              $refObj = $refJson | ConvertFrom-Json
              if ($refObj.object.type -eq 'tag') {
                $tagJson = (gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($refObj.object.sha)" 2>$null) -join "`n"
                if ($tagJson) { $body = ($tagJson | ConvertFrom-Json).message }
              }
            }
          } catch { Write-Output "annotated tag lookup failed: $($_.Exception.Message)" }
          if ([string]::IsNullOrWhiteSpace($body)) {
            $body = (git tag -l --format='%(contents)' $tag) -join "`n"
          }
          if ([string]::IsNullOrWhiteSpace($body)) { $body = $tag }
          gh release create $tag --draft --verify-tag --title $tag --notes ($body -join "`n") @assets
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft release with assets' }
